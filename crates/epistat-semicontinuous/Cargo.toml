[package]
name = "epistat-semicontinuous"
description = "Two-part, Tweedie, log-normal and marginalised two-part models for semicontinuous outcomes such as costs, with results that do not depend on the number of threads"
keywords = ["two-part", "tweedie", "lognormal", "statistics", "costs"]
categories = ["mathematics", "science"]
readme = "README.md"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
bench-internals = []

[dependencies]
epistat-glm = { path = "../epistat-glm", version = "0.2.0" }
epistat-inference = { path = "../epistat-inference", version = "0.3.2" }
epistat-linalg = { path = "../epistat-linalg", version = "0.3.1" }
epistat-rng = { path = "../epistat-rng", version = "0.1.3", features = ["rand"] }
epistat-stats = { path = "../epistat-stats", version = "0.2.5" }
bon = "3"
thiserror = "2.0.18"
# Dense linear algebra. default-features disabled to drop unused faer trees
# (sparse, rand, npy, perf-warn/log); `linalg` is required for the `.solve()`
# calls (Llt/PartialPivLu), `rayon` for the multithreaded gemm this crate leans
# on (get_global_parallelism), `nightly` for AVX-512 codegen on the x86 server.
faer = { version = "0.24", default-features = false, features = ["std", "rayon", "nightly", "linalg"] }
num-traits = "0.2.19"
comfy-table = "7.2.2"
dyn-stack = "0.13.2"
tracing = "0.1.41"
rayon = "1.11.0"

[dev-dependencies]
epistat-testkit = { path = "../epistat-testkit" }
rand_distr = "0.6.0"
approx = "0.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
criterion = { version = "0.8.2", default-features = false }
rstest = "0.26"

[[bench]]
name = "mtp_linear_algebra"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "two_part_bootstrap"
harness = false

[[bench]]
name = "mtp_rng_kernels"
harness = false
required-features = ["bench-internals"]
