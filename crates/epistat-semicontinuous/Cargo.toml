[package]
name = "epistat-semicontinuous"
description = "Two-part, Tweedie, log-normal and marginalised two-part models for semicontinuous outcomes such as costs, with results that do not depend on the number of threads"
keywords = ["two-part", "tweedie", "lognormal", "statistics", "costs"]
categories = ["mathematics", "science"]
readme = "README.md"
# The R references, and the scripts that write them, are read only by this
# repository's tests, so they stay out of the package.
exclude = ["tests/r/", "tests/reference/"]
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
bench-internals = []

[dependencies]
epistat-core = { path = "../epistat-core", version = "0.1.0" }
epistat-glm = { path = "../epistat-glm", version = "0.3.0" }
epistat-inference = { path = "../epistat-inference", version = "0.4.0" }
epistat-linalg = { path = "../epistat-linalg", version = "0.4.0" }
epistat-rng = { path = "../epistat-rng", version = "0.2.0" }
epistat-stats = { path = "../epistat-stats", version = "0.3.0" }
thiserror = "2.0.18"
rayon = "1.11.0"

[dev-dependencies]
epistat-testkit = { path = "../epistat-testkit" }
approx = "0.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
criterion = { version = "0.8.2", default-features = false }
rstest = "0.26"

[[bench]]
name = "mtp_linear_algebra"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "two_part_bootstrap"
harness = false

[[bench]]
name = "tier1_semicontinuous"
harness = false

[lints]
workspace = true
