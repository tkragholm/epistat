[package]
name = "epistat-matching"
description = "Matching for cohort studies: nearest-neighbour, optimal, full, subclass, exact, coarsened exact, genetic and cardinality matching, risk-set matching, propensity scores, balance and effect estimates, with results that do not depend on the number of threads"
keywords = ["matching", "epidemiology", "cohort", "statistics", "propensity"]
categories = ["algorithms", "science"]
readme = "README.md"
# The R references, and the scripts that write them, are read only by this
# repository's tests, so they stay out of the package.
exclude = ["tests/data/"]
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Build records from Apache Arrow arrays, see `epistat_matching::arrow`.
arrow = ["dep:arrow-array"]
default = []
bench-internals = []
# Small fixtures for tests and benchmarks: `date`, `record` and `test_outcome`.
test-utils = []

[dependencies]
epistat-core = { path = "../epistat-core", version = "0.1.0", features = ["serde"] }
epistat-epi = { path = "../epistat-epi", version = "0.1.0" }
arrow-array = { version = "60", optional = true, default-features = false }
epistat-glm = { path = "../epistat-glm", version = "0.3.0" }
epistat-inference = { path = "../epistat-inference", version = "0.4.0" }
epistat-linalg = { path = "../epistat-linalg", version = "0.4.0" }
epistat-optim = { path = "../epistat-optim", version = "0.2.0", features = ["rayon"] }
epistat-register = { path = "../epistat-register", version = "0.2.0" }
epistat-rng = { path = "../epistat-rng", version = "0.2.0" }
epistat-stats = { path = "../epistat-stats", version = "0.3.0" }
chrono = { version = "0.4", features = ["serde"] }
itertools = "0.14"
ordered-float = "5"
rapidhash = "4"
rayon = "1.11.0"
rustc-hash = "2"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
epistat-survival = { path = "../epistat-survival" }
epistat-testkit = { path = "../epistat-testkit" }
criterion = { version = "0.8.2", default-features = false }
proptest = "1.6.0"
rstest = "0.26"
serde_json = { version = "1", features = ["float_roundtrip"] }
trybuild = "1.0.112"

[[bench]]
name = "distance_channels"
harness = false
required-features = ["test-utils"]

[[bench]]
name = "balance_stats"
harness = false
required-features = ["bench-internals", "test-utils"]

[[bench]]
name = "transition_strata"
harness = false

[[bench]]
name = "risk_set_caliper"
harness = false

[[bench]]
name = "matchit_compare"
harness = false

[[bench]]
name = "tier1_balance_scale"
harness = false

[lints]
workspace = true
