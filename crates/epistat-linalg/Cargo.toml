[package]
name = "epistat-linalg"
description = "Dense solves with fallbacks and row-blocked products on faer, with results that do not depend on the number of threads"
keywords = ["linear-algebra", "faer", "reproducible", "statistics"]
categories = ["mathematics", "science"]
readme = "README.md"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
epistat-core = { path = "../epistat-core", version = "0.1.0" }
dyn-stack = "0.13"
epistat-stats = { path = "../epistat-stats", version = "0.3.0" }
faer = { version = "0.24", default-features = false, features = ["std", "linalg", "rayon"] }
rayon = "1.10"
thiserror = "2"

[dev-dependencies]
epistat-testkit = { path = "../epistat-testkit" }
serde = { version = "1.0.200", features = ["derive"] }

[[bench]]
name = "tier1_linalg"
harness = false

[lints]
workspace = true
