[package]
name = "epistat-glm"
description = "Generalised linear models fitted by IRLS as R's glm.fit does, with results that do not depend on the number of threads"
keywords = ["statistics", "glm", "regression", "irls", "tweedie"]
categories = ["mathematics", "science"]
readme = "README.md"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
epistat-inference = { path = "../epistat-inference", version = "0.3.2" }
epistat-linalg = { path = "../epistat-linalg", version = "0.3.1" }
epistat-stats = { path = "../epistat-stats", version = "0.2.5" }
rayon = "1.10"
thiserror = "2"

[dev-dependencies]
epistat-testkit = { path = "../epistat-testkit" }
serde = { version = "1.0.200", features = ["derive"] }

[[bench]]
name = "tier1_glm"
harness = false

[[bench]]
name = "tier2_glm"
harness = false

[[bench]]
name = "tier2_af"
harness = false

[[bench]]
name = "tier1_glm_scale"
harness = false

[lints]
workspace = true
