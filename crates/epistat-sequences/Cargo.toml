[package]
name = "epistat-sequences"
description = "Optimal-matching, Hamming and dynamic Hamming distances between state sequences, weighted k-medoids, silhouettes and null-model validation"
keywords = ["sequence-analysis", "optimal-matching", "k-medoids", "clustering", "silhouette"]
categories = ["algorithms", "science"]
readme = "README.md"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
epistat-core = { path = "../epistat-core", version = "0.1.0" }
epistat-optim = { path = "../epistat-optim", version = "0.2.0", features = ["rayon"] }
epistat-rng = { path = "../epistat-rng", version = "0.2.0" }
epistat-stats = { path = "../epistat-stats", version = "0.3.0" }
rayon = "1.10"
thiserror = "2"

[dev-dependencies]
epistat-testkit = { path = "../epistat-testkit" }

[lints]
workspace = true
