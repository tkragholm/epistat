[package]
name = "epistat-impute"
description = "Multiple imputation by chained equations with mice's normal, predictive mean matching, logistic and multinomial methods, passive variables and survival outcomes, with results that do not depend on the number of threads"
keywords = ["imputation", "missing-data", "mice", "statistics", "epidemiology"]
categories = ["mathematics", "science"]
readme = "README.md"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
epistat-core = { path = "../epistat-core", version = "0.1.0" }
epistat-glm = { path = "../epistat-glm", version = "0.3.0" }
epistat-inference = { path = "../epistat-inference", version = "0.3.2" }
epistat-linalg = { path = "../epistat-linalg", version = "0.3.1" }
epistat-rng = { path = "../epistat-rng", version = "0.1.3" }
rayon = "1.10"
thiserror = "2"

[dev-dependencies]
epistat-survival = { path = "../epistat-survival", version = "0.4.0" }
epistat-testkit = { path = "../epistat-testkit" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[[bench]]
name = "tier3_impute"
harness = false

[lints]
workspace = true
