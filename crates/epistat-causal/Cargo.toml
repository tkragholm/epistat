[package]
name = "epistat-causal"
description = "Causal effect estimators for cohort data: augmented inverse probability weighting for binary and continuous outcomes, with influence-function and stacked variances that do not depend on the number of threads"
keywords = ["statistics", "causal-inference", "doubly-robust", "epidemiology", "aipw"]
categories = ["mathematics", "science"]
readme = "README.md"
# The R references are JSON that only this repository's tests read; the R
# scripts that write them stay in the package as their provenance.
exclude = ["tests/data/*.json"]
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
epistat-glm = { path = "../epistat-glm", version = "0.2.0" }
epistat-inference = { path = "../epistat-inference", version = "0.3.2" }
epistat-linalg = { path = "../epistat-linalg", version = "0.3.1" }
epistat-stats = { path = "../epistat-stats", version = "0.2.5" }
thiserror = "2"

[dev-dependencies]
epistat-rng = { path = "../epistat-rng", version = "0.1.3" }
epistat-testkit = { path = "../epistat-testkit" }
serde = { version = "1.0.200", features = ["derive"] }

[[bench]]
name = "tier1_causal"
harness = false

[lints]
workspace = true
