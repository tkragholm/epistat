[package]
name = "epistat-causal"
description = "Causal effect estimators for cohort data: augmented inverse probability weighting, targeted maximum likelihood estimation, entropy balancing and CBPS, and the parametric g-formula, with variances that do not depend on the number of threads"
keywords = ["statistics", "causal-inference", "doubly-robust", "epidemiology", "aipw"]
categories = ["mathematics", "science"]
readme = "README.md"
# The R references, and the scripts that write them, are read only by this
# repository's tests, so they stay out of the package.
exclude = ["tests/data/"]
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
epistat-core = { path = "../epistat-core", version = "0.1.0" }
epistat-glm = { path = "../epistat-glm", version = "0.3.0" }
epistat-inference = { path = "../epistat-inference", version = "0.4.0" }
epistat-linalg = { path = "../epistat-linalg", version = "0.4.0" }
epistat-optim = { path = "../epistat-optim", version = "0.2.0" }
epistat-rng = { path = "../epistat-rng", version = "0.2.0" }
epistat-stats = { path = "../epistat-stats", version = "0.3.0" }
rayon = "1.10"
thiserror = "2"

[dev-dependencies]
epistat-testkit = { path = "../epistat-testkit" }
serde = { version = "1.0.200", features = ["derive"] }

[[bench]]
name = "tier1_causal"
harness = false

[[bench]]
name = "tier3_balance"
harness = false

[[bench]]
name = "tier3_gformula"
harness = false

[[bench]]
name = "tier3_tmle"
harness = false

[lints]
workspace = true
