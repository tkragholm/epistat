[package]
name = "epistat-inference"
description = "Influence-function and sandwich variances, cluster-robust and bootstrap intervals that reproduce across thread counts"
keywords = ["statistics", "bootstrap", "sandwich", "cluster-robust", "inference"]
categories = ["mathematics", "science"]
readme = "README.md"
version = "0.3.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
epistat-linalg = { path = "../epistat-linalg", version = "0.3.1" }
epistat-rng = { path = "../epistat-rng", version = "0.1.0" }
epistat-stats = { path = "../epistat-stats", version = "0.2.5" }
rayon = "1.10"
thiserror = "2"

[dev-dependencies]
epistat-testkit = { path = "../epistat-testkit" }
serde = { version = "1.0.200", features = ["derive"] }
# Parses floats to the nearest double, so the R reference is compared to the bit.
serde_json = { version = "1.0.120", features = ["float_roundtrip"] }

[[bench]]
name = "tier1_inference"
harness = false

[lints]
workspace = true
