[package]
name = "epistat-optim"
description = "BFGS, Nelder-Mead, simplex methods, branch and bound and minimum-cost flow for small statistical problems"
keywords = ["optimization", "bfgs", "simplex", "nelder-mead", "statistics"]
categories = ["mathematics", "science"]
readme = "README.md"
# The R references, and the scripts that write them, are read only by this
# repository's tests, so they stay out of the package.
exclude = ["tests/data/"]
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
rayon = ["dep:rayon"]

[dependencies]
epistat-core = { path = "../epistat-core", version = "0.1.0" }
epistat-rng = { path = "../epistat-rng", version = "0.2.0" }
rayon = { version = "1.10", optional = true }

[dev-dependencies]
epistat-testkit = { path = "../epistat-testkit" }

[lints]
workspace = true
