[package]
name = "epistat-stats"
description = "Sample quantiles, distributions, floating-point sums, balance statistics, E-values, Rosenbaum bounds and standardisation that agree with R and Python to the bit"
keywords = ["statistics", "quantile", "normal-distribution", "summation"]
categories = ["mathematics", "science"]
readme = "README.md"
version = "0.2.5"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
epistat-core = { path = "../epistat-core", version = "0.1.0" }
epistat-rng = { path = "../epistat-rng", version = "0.1.3" }
rayon = "1.10"
thiserror = "2"

[dev-dependencies]
epistat-testkit = { path = "../epistat-testkit" }
serde = { version = "1.0.200", features = ["derive"] }
# Parses floats to the nearest double, so the R references are compared to the bit.
serde_json = { version = "1.0.120", features = ["float_roundtrip"] }

[[bench]]
name = "tier1_stats"
harness = false

[[bench]]
name = "tier2_bias"
harness = false

[lints]
workspace = true
