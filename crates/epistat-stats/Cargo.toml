[package]
name = "epistat-stats"
description = "Sample quantiles, the normal distribution and floating-point sums that agree with R and Python to the bit"
keywords = ["statistics", "quantile", "normal-distribution", "summation"]
categories = ["mathematics", "science"]
readme = "README.md"
version = "0.2.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
rayon = "1.10"
thiserror = "2"

[dev-dependencies]
epistat-testkit = { path = "../epistat-testkit" }
serde = { version = "1.0.200", features = ["derive"] }

[lints]
workspace = true
