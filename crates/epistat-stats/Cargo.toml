[package]
name = "epistat-stats"
description = "Distribution functions, sample quantiles, floating-point sums, weighted moments and k-means that agree with R and Python to the bit"
keywords = ["statistics", "quantile", "normal-distribution", "summation"]
categories = ["mathematics", "science"]
readme = "README.md"
# The R references, and the scripts that write them, are read only by this
# repository's tests, so they stay out of the package.
exclude = ["tests/data/"]
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
epistat-core = { path = "../epistat-core", version = "0.1.0" }
epistat-rng = { path = "../epistat-rng", version = "0.2.0" }
rayon = "1.10"
thiserror = "2"

[dev-dependencies]
epistat-testkit = { path = "../epistat-testkit" }
serde = { version = "1.0.200", features = ["derive"] }
# Parses floats to the nearest double, so the R references are compared to the bit.
serde_json = { version = "1.0.120", features = ["float_roundtrip"] }

[lints]
workspace = true
