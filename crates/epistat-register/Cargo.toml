[package]
name = "epistat-register"
description = "Calendar-year person-time, interval merging, connected components over shared keys, constant-price deflation, ICD-10 normalisation, age, code sets for ICD-10, ICD-8 and ATC, event definitions, comorbidity indices, drug exposure episodes, waiting time distributions and PRE2DUP drug use periods for register data"
keywords = ["register-data", "person-time", "intervals", "cpi", "epidemiology"]
categories = ["algorithms", "science"]
readme = "README.md"
# The R references, and the scripts that write them, are read only by this
# repository's tests, so they stay out of the package. The benches include a
# harness from the repository's bench/ directory and build only in the
# repository, so they stay out as well.
exclude = ["benches/", "tests/data/"]
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# The Statistics Denmark annual consumer price index, 1900 to 2025, as
# `DENMARK_ANNUAL_CPI`. Off by default so the crate carries no national data
# for callers who bring their own table.
denmark = []
# Serde support for `icd10::Icd10Chapter`, as its label string.
serde = ["dep:serde"]

[dependencies]
epistat-core = { path = "../epistat-core", version = "0.1.0" }
epistat-optim = { path = "../epistat-optim", version = "0.2.0" }
epistat-stats = { path = "../epistat-stats", version = "0.3.0" }
thiserror = "2"
serde = { version = "1", optional = true }

[dev-dependencies]
epistat-testkit = { path = "../epistat-testkit" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[[bench]]
name = "tier1_register"
harness = false

[[bench]]
name = "tier2_register"
harness = false

[lints]
workspace = true
