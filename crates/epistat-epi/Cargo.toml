[package]
name = "epistat-epi"
description = "Rates, standardised and Mantel-Haenszel estimates, standardised incidence ratios, the Kitagawa decomposition, E-values, quantitative bias analysis, Rosenbaum bounds and balance statistics, checked against R"
keywords = ["epidemiology", "statistics", "bias-analysis", "standardisation"]
categories = ["science", "mathematics"]
readme = "README.md"
# The R references, and the scripts that write them, are read only by this
# repository's tests, so they stay out of the package. The benches include a
# harness from the repository's bench/ directory and build only in the
# repository, so they stay out as well.
exclude = ["benches/", "tests/data/"]
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
epistat-core = { path = "../epistat-core", version = "0.1.0" }
epistat-rng = { path = "../epistat-rng", version = "0.2.0" }
epistat-stats = { path = "../epistat-stats", version = "0.3.0" }
thiserror = "2"

[dev-dependencies]
epistat-testkit = { path = "../epistat-testkit" }
serde = { version = "1.0.200", features = ["derive"] }
# Parses floats to the nearest double, so the R references are compared to the bit.
serde_json = { version = "1.0.120", features = ["float_roundtrip"] }

[[bench]]
name = "tier1_epi"
harness = false

[[bench]]
name = "tier2_bias"
harness = false

[lints]
workspace = true
