[package]
name = "epistat-survival"
description = "Survival analysis for follow-up data: Cox regression, Fine-Gray, Aalen-Johansen, multi-state models, Kaplan-Meier, metrics and pseudo-observations, with results that do not depend on the number of threads, and optional Apache Arrow input"
keywords = ["statistics", "survival", "cox", "competing-risks", "multi-state"]
categories = ["mathematics", "science"]
readme = "README.md"
# The R references, and the scripts that write them, are read only by this
# repository's tests, so they stay out of the package. The benches include a
# harness from the repository's bench/ directory and build only in the
# repository, so they stay out as well.
exclude = ["benches/", "tests/data/"]
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Build `SurvData` from Apache Arrow arrays without copying, see `epistat_survival::arrow`.
arrow = ["dep:arrow-array"]

[dependencies]
epistat-core = { path = "../epistat-core", version = "0.1.0" }
arrow-array = { version = "60", optional = true, default-features = false }
epistat-glm = { path = "../epistat-glm", version = "0.3.0" }
epistat-inference = { path = "../epistat-inference", version = "0.4.0" }
epistat-linalg = { path = "../epistat-linalg", version = "0.4.0" }
epistat-optim = { path = "../epistat-optim", version = "0.2.0" }
epistat-rng = { path = "../epistat-rng", version = "0.2.0" }
epistat-stats = { path = "../epistat-stats", version = "0.3.0" }
rayon = "1.10"
thiserror = "2"

[dev-dependencies]
epistat-epi = { path = "../epistat-epi", version = "0.1.0" }
epistat-testkit = { path = "../epistat-testkit" }
serde = { version = "1.0.200", features = ["derive"] }

[[bench]]
name = "survival_compare"
harness = false

[[bench]]
name = "tier1_survival"
harness = false

[[bench]]
name = "tier1_cox_scale"
harness = false

[[bench]]
name = "tier2_survival"
harness = false

[[bench]]
name = "tier2_designs"
harness = false

[[bench]]
name = "tier3_survival"
harness = false

[[bench]]
name = "tier3_relsurv"
harness = false

[[bench]]
name = "tier3_frailty"
harness = false

[[bench]]
name = "tier3_designs"
harness = false

[lints]
workspace = true
