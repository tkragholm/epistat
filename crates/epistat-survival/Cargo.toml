[package]
name = "epistat-survival"
description = "Survival analysis for follow-up data: Cox regression, Fine-Gray, Aalen-Johansen, multi-state models, Kaplan-Meier, metrics and pseudo-observations, with results that do not depend on the number of threads, and optional Apache Arrow input"
keywords = ["statistics", "survival", "cox", "competing-risks", "multi-state"]
categories = ["mathematics", "science"]
readme = "README.md"
# The R references are 20 MB of JSON that only this repository's tests read;
# the R scripts that write them stay in the package as their provenance.
exclude = ["tests/data/*.json"]
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# Build `SurvData` from Apache Arrow arrays without copying, see `epistat_survival::arrow`.
arrow = ["dep:arrow-array"]

[dependencies]
arrow-array = { version = "60", optional = true, default-features = false }
epistat-glm = { path = "../epistat-glm", version = "0.2.0" }
epistat-inference = { path = "../epistat-inference", version = "0.3.2" }
epistat-linalg = { path = "../epistat-linalg", version = "0.3.1" }
epistat-optim = { path = "../epistat-optim", version = "0.1.1" }
epistat-rng = { path = "../epistat-rng", version = "0.1.1" }
epistat-stats = { path = "../epistat-stats", version = "0.2.5" }
rayon = "1.10"
thiserror = "2"

[dev-dependencies]
epistat-testkit = { path = "../epistat-testkit" }
serde = { version = "1.0.200", features = ["derive"] }

[[bench]]
name = "survival_compare"
harness = false

[[bench]]
name = "tier1_survival"
harness = false

[[bench]]
name = "tier2_survival"
harness = false

[[bench]]
name = "tier2_designs"
harness = false

[[bench]]
name = "tier3_survival"
harness = false

[[bench]]
name = "tier3_relsurv"
harness = false

[lints]
workspace = true
