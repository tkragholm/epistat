[package]
name = "epistat-did"
description = "Difference-in-differences: staggered ATT(g,t) with its aggregations, doubly robust two-period estimators, triple differences, continuous treatments and HonestDiD sensitivity analysis, with influence-function inference"
keywords = ["did", "causal-inference", "event-study", "epidemiology", "statistics"]
categories = ["mathematics", "science"]
readme = "README.md"
# The R references are about 3 MB of JSON that only this repository's tests read;
# the R scripts that write them stay in the package as their provenance.
exclude = ["tests/data/*.json"]
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
autotests = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
# HonestDiD sensitivity analysis (Rambachan-Roth). Optional because it is the
# only consumer of the `clarabel` conic solver; the linear programs of the
# conditional test run on the crate's own dense simplex. Consumers that only
# need ATT(g,t), DRDID and the aggregations link no solver.
honest = ["dep:clarabel"]
# The parity suite covers the honest surface as well, so it implies the feature.
parity-tests = ["honest"]
# faer's runtime-dispatched AVX-512 kernels, through epistat-linalg.
nightly = ["epistat-linalg/nightly"]

[dependencies]
bon = "3"
clarabel = { version = "0.11.1", optional = true }
epistat-inference = { path = "../epistat-inference", version = "0.3.2" }
epistat-glm = { path = "../epistat-glm", version = "0.2.0" }
epistat-linalg = { path = "../epistat-linalg", version = "0.3.1" }
epistat-optim = { path = "../epistat-optim", version = "0.1.1" }
epistat-rng = { path = "../epistat-rng", version = "0.1.3" }
epistat-stats = { path = "../epistat-stats", version = "0.2.5" }
itertools = "0.14"
rayon = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["float_roundtrip"] }
thiserror = "2.0.18"
tracing = "0.1.41"
once_map = "0.4.23"

[dev-dependencies]
# The unit tests draw their data through rand on an epistat-rng stream.
epistat-rng = { path = "../epistat-rng", features = ["rand"] }
epistat-testkit = { path = "../epistat-testkit" }
criterion = { version = "0.8.2", default-features = false }
rand = "0.10.0"
rand_distr = "0.6.0"
rstest = "0.26"
proptest = "1.6.0"

[[bench]]
name = "core_workflows"
harness = false
required-features = ["honest"]

[[test]]
name = "dataset_validation"
path = "tests/dataset_validation.rs"

[[test]]
name = "solver_counts"
path = "tests/solver_counts.rs"
required-features = ["honest"]

[[test]]
name = "parity"
path = "tests/parity.rs"
required-features = ["parity-tests"]

[[test]]
name = "dcdh_properties"
path = "tests/dcdh_properties.rs"

[[test]]
name = "parity_dcdh"
path = "tests/parity_dcdh.rs"

[[test]]
name = "parity_acrt"
path = "tests/parity_acrt.rs"

[[test]]
name = "parity_efficient"
path = "tests/parity_efficient.rs"

[[test]]
name = "efficient_influence"
path = "tests/efficient_influence.rs"

[[test]]
name = "parity_cs_panel"
path = "tests/parity_cs_panel.rs"
required-features = ["parity-tests"]

[[test]]
name = "parity_aggte"
path = "tests/parity_aggte.rs"

[[test]]
name = "parity_drdid_rc_efficient"
path = "tests/parity_drdid_rc_efficient.rs"
required-features = ["parity-tests"]

[[test]]
name = "parity_att_gt_rules"
path = "tests/parity_att_gt_rules.rs"
required-features = ["parity-tests"]

[[test]]
name = "parity_ipw_or"
path = "tests/parity_ipw_or.rs"
required-features = ["parity-tests"]

[[test]]
name = "parity_drdid_improved"
path = "tests/parity_drdid_improved.rs"
required-features = ["parity-tests"]

[[test]]
name = "parity_smoothness"
path = "tests/parity_smoothness.rs"
required-features = ["parity-tests"]

[[test]]
name = "parity_twfe"
path = "tests/parity_twfe.rs"

[[test]]
name = "parity_bacon"
path = "tests/parity_bacon.rs"

[[test]]
name = "parity_synthdid"
path = "tests/parity_synthdid.rs"

[[test]]
name = "parity_pretrends"
path = "tests/parity_pretrends.rs"

[[test]]
name = "parity_imputation"
path = "tests/parity_imputation.rs"

[[test]]
name = "parity_sunab"
path = "tests/parity_sunab.rs"

[[test]]
name = "imputation_properties"
path = "tests/imputation_properties.rs"

[[test]]
name = "fingerprint"
path = "tests/fingerprint.rs"
required-features = ["honest"]

[[bench]]
name = "tier1_did"
harness = false

[[bench]]
name = "tier1_synthdid"
harness = false

[[bench]]
name = "tier1_imputation"
harness = false

[lints]
workspace = true
