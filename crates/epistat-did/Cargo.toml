[package]
name = "epistat-did"
description = "Difference-in-differences: staggered ATT(g,t) with its aggregations, doubly robust two-period estimators, triple differences, continuous treatments and HonestDiD sensitivity analysis, with influence-function inference"
keywords = ["did", "causal-inference", "event-study", "epidemiology", "statistics"]
categories = ["mathematics", "science"]
readme = "README.md"
# The R references are about 3 MB of JSON that only this repository's tests read;
# the R scripts that write them stay in the package as their provenance.
exclude = ["tests/data/*.json"]
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
autotests = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
# HonestDiD sensitivity analysis (Rambachan-Roth). Optional because it is the
# only consumer of the `clarabel` conic solver; the linear programs of the
# conditional test run on the crate's own dense simplex. Consumers that only
# need ATT(g,t), DRDID and the aggregations link no solver.
honest = ["dep:clarabel"]
# The parity suite covers the honest surface as well, so it implies the feature.
parity-tests = ["honest"]
# faer's runtime-dispatched AVX-512 kernels, through epistat-linalg.
nightly = ["epistat-linalg/nightly"]
hotpath = ["dep:hotpath", "hotpath/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]

[dependencies]
bon = "3"
clarabel = { version = "0.11.1", optional = true }
epistat-inference = { path = "../epistat-inference", version = "0.3.2" }
epistat-glm = { path = "../epistat-glm", version = "0.2.0" }
epistat-linalg = { path = "../epistat-linalg", version = "0.3.1" }
epistat-optim = { path = "../epistat-optim", version = "0.1.1" }
epistat-rng = { path = "../epistat-rng", version = "0.1.3", features = ["rand"] }
epistat-stats = { path = "../epistat-stats", version = "0.2.5" }
itertools = "0.14"
rayon = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.18"
tracing = "0.1.41"
hotpath = { version = "0.15.0", optional = true }
once_map = "0.4.23"

[dev-dependencies]
epistat-testkit = { path = "../epistat-testkit" }
criterion = { version = "0.8.2", default-features = false }
rand = "0.10.0"
rand_distr = "0.6.0"
rstest = "0.26"
proptest = "1.6.0"

[[bench]]
name = "core_workflows"
harness = false
required-features = ["honest"]

[[test]]
name = "dataset_validation"
path = "tests/dataset_validation.rs"

[[test]]
name = "solver_counts"
path = "tests/solver_counts.rs"
required-features = ["honest"]

[[test]]
name = "parity"
path = "tests/parity.rs"
required-features = ["parity-tests"]

[[test]]
name = "parity_cs_panel"
path = "tests/parity_cs_panel.rs"
required-features = ["parity-tests"]

[[test]]
name = "parity_drdid_rc_efficient"
path = "tests/parity_drdid_rc_efficient.rs"
required-features = ["parity-tests"]

[[test]]
name = "parity_drdid_improved"
path = "tests/parity_drdid_improved.rs"
required-features = ["parity-tests"]

[[test]]
name = "fingerprint"
path = "tests/fingerprint.rs"
required-features = ["honest"]
