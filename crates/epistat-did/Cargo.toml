[package]
name = "epistat-did"
description = "Difference-in-differences: staggered ATT(g,t) with its aggregations, doubly robust two-period estimators, triple differences and continuous treatments, with influence-function inference"
keywords = ["did", "causal-inference", "event-study", "epidemiology", "statistics"]
categories = ["mathematics", "science"]
readme = "README.md"
# The R references are about 3 MB of JSON that only this repository's tests read;
# the R scripts that write them stay in the package as their provenance.
exclude = ["tests/data/*.json"]
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
autotests = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
# The R parity suites that take longest.
parity-tests = []
# faer's runtime-dispatched AVX-512 kernels, through epistat-linalg.
nightly = ["epistat-linalg/nightly"]

[dependencies]
epistat-core = { path = "../epistat-core", version = "0.1.0" }
bon = "3"
epistat-inference = { path = "../epistat-inference", version = "0.4.0" }
epistat-glm = { path = "../epistat-glm", version = "0.3.0" }
epistat-linalg = { path = "../epistat-linalg", version = "0.4.0" }
epistat-optim = { path = "../epistat-optim", version = "0.2.0" }
epistat-rng = { path = "../epistat-rng", version = "0.2.0" }
epistat-stats = { path = "../epistat-stats", version = "0.3.0" }
rayon = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["float_roundtrip"] }
thiserror = "2.0.18"

[dev-dependencies]
# The unit tests draw their data through rand on an epistat-rng stream.
epistat-rng = { path = "../epistat-rng", features = ["rand"] }
epistat-testkit = { path = "../epistat-testkit" }
criterion = { version = "0.8.2", default-features = false }
rand = "0.10.0"
rand_distr = "0.6.0"
rstest = "0.26"
proptest = "1.6.0"

[[bench]]
name = "core_workflows"
harness = false

[[test]]
name = "parity"
path = "tests/parity.rs"
required-features = ["parity-tests"]

[[test]]
name = "dcdh_properties"
path = "tests/dcdh_properties.rs"

[[test]]
name = "parity_dcdh"
path = "tests/parity_dcdh.rs"

[[test]]
name = "parity_dcdh_options"
path = "tests/parity_dcdh_options.rs"

[[test]]
name = "parity_acrt"
path = "tests/parity_acrt.rs"

[[test]]
name = "parity_efficient"
path = "tests/parity_efficient.rs"

[[test]]
name = "efficient_influence"
path = "tests/efficient_influence.rs"

[[test]]
name = "parity_cs_panel"
path = "tests/parity_cs_panel.rs"
required-features = ["parity-tests"]

[[test]]
name = "parity_aggte"
path = "tests/parity_aggte.rs"

[[test]]
name = "parity_drdid_rc_efficient"
path = "tests/parity_drdid_rc_efficient.rs"
required-features = ["parity-tests"]

[[test]]
name = "parity_att_gt_rules"
path = "tests/parity_att_gt_rules.rs"
required-features = ["parity-tests"]

[[test]]
name = "parity_ipw_or"
path = "tests/parity_ipw_or.rs"
required-features = ["parity-tests"]

[[test]]
name = "parity_drdid_improved"
path = "tests/parity_drdid_improved.rs"
required-features = ["parity-tests"]

[[test]]
name = "parity_twfe"
path = "tests/parity_twfe.rs"

[[test]]
name = "parity_bacon"
path = "tests/parity_bacon.rs"

[[test]]
name = "parity_synthdid"
path = "tests/parity_synthdid.rs"

[[test]]
name = "parity_imputation"
path = "tests/parity_imputation.rs"

[[test]]
name = "parity_sunab"
path = "tests/parity_sunab.rs"

[[test]]
name = "parity_etwfe"
path = "tests/parity_etwfe.rs"

[[test]]
name = "parity_etwfe_glm"
path = "tests/parity_etwfe_glm.rs"

[[test]]
name = "parity_fe_intervals"
path = "tests/parity_fe_intervals.rs"

[[test]]
name = "imputation_properties"
path = "tests/imputation_properties.rs"

[[test]]
name = "parity_missing"
path = "tests/parity_missing.rs"

[[test]]
name = "missing_properties"
path = "tests/missing_properties.rs"

[[test]]
name = "fingerprint"
path = "tests/fingerprint.rs"

[[test]]
name = "study_path"
path = "tests/study_path.rs"

[[bench]]
name = "tier1_did"
harness = false

[[bench]]
name = "tier1_synthdid"
harness = false

[[bench]]
name = "tier1_imputation"
harness = false

[[bench]]
name = "tier1_missing"
harness = false

[lints]
workspace = true
