[package]
name = "epistat-testkit"
description = "Test helpers for numerical code: tolerances, bit fingerprints, thread-count checks and R reference files"
keywords = ["testing", "numerical", "reproducible", "statistics"]
categories = ["development-tools::testing", "science"]
readme = "README.md"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
rayon = "1.10"
serde = { version = "1.0.200", features = ["derive"] }
# Exact float parsing, so reference values read the same in a package build
# and a workspace build.
serde_json = { version = "1.0.120", features = ["float_roundtrip"] }

[lints]
workspace = true
