name: CI

on:
  push:
    branches: [main, "ci/**", "redesign/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The `ci` profile in Cargo.toml: optimised, with debug assertions and
      # overflow checks, so the suite runs several times faster than in the
      # unoptimised `test` profile.
      - run: cargo test --profile ci --workspace --all-features --no-fail-fast

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # The committed lock is ignored: a fresh resolution is what a consumer gets.
  # The minimum supported Rust is 1.89, the first with fearless_simd's
  # requirements and bytemuck's AVX-512 types, which `epistat-linalg`'s
  # `nightly` feature uses.
  msrv:
    strategy:
      matrix:
        include:
          - toolchain: "1.89"
            flags: --workspace
          - toolchain: "1.89"
            flags: --workspace --all-features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: rm Cargo.lock
      - run: cargo check ${{ matrix.flags }}
